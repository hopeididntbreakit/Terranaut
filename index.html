<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TerraNaut</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: rgba(15, 20, 28, 0.92);
      --border: rgba(120, 160, 200, 0.15);
      --text: #e8f0f8;
      --muted: #8a9bb0;
      --accent: #5b9fd4;
      --accent-dim: #3a6a8a;
      --anomaly: #e07a5f;
      --good: #6bcB77;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .leaflet-container {
      background: #0d1218;
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.55) !important;
      color: #8a9bb0 !important;
      font-size: 10px !important;
      max-width: 60%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .leaflet-control-attribution a {
      color: #8a9bb0 !important;
    }

    .panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    input[type="text"]:focus {
      border-color: var(--accent-dim);
    }

    button {
      background: var(--accent);
      color: #0b0f14;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:active {
      background: #4a8bc0;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    button.scan-on {
      background: var(--anomaly);
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stat-value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .anomaly-active .stat-value.mag {
      color: var(--anomaly);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      font-size: 11px;
    }

    .pill.live {
      color: var(--good);
    }

    .pill.anomaly {
      color: var(--anomaly);
      background: rgba(224, 122, 95, 0.15);
    }

    .radius-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    /* Strength bar */
    .strength-wrap {
      margin-top: 8px;
    }
    .strength-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .strength-bar {
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.15s, background 0.2s;
    }
    .anomaly-active .strength-fill {
      background: var(--anomaly);
    }

    .target-pulse {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 0 rgba(91, 159, 212, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(91, 159, 212, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(91, 159, 212, 0); }
      100% { box-shadow: 0 0 0 0 rgba(91, 159, 212, 0); }
    }

    .user-dot {
      width: 14px;
      height: 14px;
      background: #fff;
      border: 3px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .info-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    /* Compass / North arrow overlay */
    .compass {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(15, 20, 28, 0.88);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      pointer-events: none;
    }
    .compass-rose {
      width: 40px;
      height: 40px;
      position: relative;
      transition: transform 0.15s ease-out;
    }
    .compass-needle {
      position: absolute;
      top: 2px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 18px solid var(--anomaly);
    }
    .compass-needle::after {
      content: "";
      position: absolute;
      top: 18px;
      left: -6px;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 16px solid #8a9bb0;
    }
    .compass-n {
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .compass-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="compass" id="compass">
    <div class="compass-rose" id="compass-rose">
      <div class="compass-n">N</div>
      <div class="compass-needle"></div>
    </div>
    <div class="compass-label" id="compass-label">—°</div>
  </div>

  <div class="panel" id="panel">
    <div class="status-bar">
      <span id="gps-status" class="pill">Locating…</span>
      <span id="mag-status" class="pill">Mag: —</span>
    </div>

    <div class="row">
      <input type="text" id="intention" placeholder="Intention (optional)" maxlength="80" />
      <button id="generate">Go</button>
    </div>

    <div class="row radius-control">
      <span>Radius</span>
      <input type="range" id="radius" min="300" max="4000" step="100" value="1200" />
      <span id="radius-val">1.2 km</span>
    </div>

    <div class="row">
      <button id="scanBtn" class="secondary" style="flex:1">Scan Mode: Off</button>
      <button id="clearTrail" class="secondary">Clear Trail</button>
    </div>

    <div class="stats" id="stats">
      <div>Distance <span class="stat-value" id="distance">—</span></div>
      <div>Bearing <span class="stat-value" id="bearing">—</span></div>
      <div>Field <span class="stat-value mag" id="field">—</span></div>
      <div>Δ Field <span class="stat-value mag" id="delta">—</span></div>
    </div>

    <div class="strength-wrap">
      <div class="strength-label">
        <span>Field strength</span>
        <span id="strength-text">—</span>
      </div>
      <div class="strength-bar">
        <div class="strength-fill" id="strength-fill"></div>
      </div>
    </div>

    <div class="info-note" id="note">
      Walk toward the point. Stronger / sharper magnetic spikes usually mean closer to the surface. Broad weak changes may be deeper or larger objects. Phone sensors only reach a few meters at best.
    </div>
  </div>

  <script>
    // ---------- Config ----------
    const DEFAULT_RADIUS = 1200;
    const MAX_TRAIL_POINTS = 250;
    const SCAN_INTERVAL_MS = 800;

    // ---------- State ----------
    let map, userMarker, targetMarker, accuracyCircle;
    let userLat = null, userLng = null;
    let targetLat = null, targetLng = null;
    let watchId = null;

    // Magnetic
    let magSupported = false;
    let baselineMag = null;
    let lastMag = null;
    let magHistory = [];
    const MAG_HISTORY_LEN = 12;
    let anomaly = false;

    // Scan / trail
    let scanMode = false;
    let trailLayer = null;
    let trailPoints = [];
    let lastScanTime = 0;

    // ---------- Helpers ----------
    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function bearing(lat1, lng1, lat2, lng2) {
      const y = Math.sin(toRad(lng2-lng1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function formatDist(m) {
      if (m == null) return "—";
      if (m < 1000) return Math.round(m) + " m";
      return (m / 1000).toFixed(2) + " km";
    }

    function formatBearing(b) {
      if (b == null) return "—";
      const dirs = ["N","NE","E","SE","S","SW","W","NW"];
      const idx = Math.round(b / 45) % 8;
      return Math.round(b) + "° " + dirs[idx];
    }

    function seededRandom(seedStr) {
      let h = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function() {
        h += h << 13; h ^= h >>> 7; h += h << 3;
        h ^= h >>> 17; h += h << 5;
        return (h >>> 0) / 4294967296;
      };
    }

    function randomPointInRadius(lat, lng, radiusM, rng) {
      const r = radiusM * Math.sqrt(rng());
      const theta = rng() * 2 * Math.PI;
      const dx = r * Math.cos(theta);
      const dy = r * Math.sin(theta);
      const newLat = lat + (dy / 111320);
      const newLng = lng + (dx / (111320 * Math.cos(toRad(lat))));
      return { lat: newLat, lng: newLng };
    }

    // Color from delta strength (blue → yellow → red)
    function strengthColor(absDelta) {
      if (absDelta < 5) return "#5b9fd4";
      if (absDelta < 12) return "#e0b34e";
      if (absDelta < 25) return "#e07a5f";
      return "#e04f4f";
    }

    // ---------- Map ----------
    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: true
      }).setView([36.16, -86.78], 15);

      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ"
      }).addTo(map);

      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 19,
        opacity: 0.85
      }).addTo(map);

      trailLayer = L.layerGroup().addTo(map);
      L.control.zoom({ position: "topright" }).addTo(map);
    }

    function updateUserMarker(lat, lng, accuracy) {
      const latlng = [lat, lng];
      if (!userMarker) {
        userMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: "",
            html: '<div class="user-dot"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
          })
        }).addTo(map);
      } else {
        userMarker.setLatLng(latlng);
      }

      if (accuracyCircle) {
        accuracyCircle.setLatLng(latlng).setRadius(accuracy || 30);
      } else {
        accuracyCircle = L.circle(latlng, {
          radius: accuracy || 30,
          color: "#5b9fd4",
          weight: 1,
          fillColor: "#5b9fd4",
          fillOpacity: 0.08
        }).addTo(map);
      }
    }

    function setTarget(lat, lng) {
      targetLat = lat;
      targetLng = lng;
      const latlng = [lat, lng];

      if (targetMarker) {
        targetMarker.setLatLng(latlng);
      } else {
        targetMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: "",
            html: '<div class="target-pulse"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          })
        }).addTo(map);
      }

      if (userLat != null) {
        const bounds = L.latLngBounds([userLat, userLng], latlng);
        map.fitBounds(bounds.pad(0.15), { maxZoom: 18 });
      } else {
        map.setView(latlng, 17);
      }
      updateStats();
    }

    function updateStats() {
      if (userLat == null || targetLat == null) {
        document.getElementById("distance").textContent = "—";
        document.getElementById("bearing").textContent = "—";
        return;
      }
      const dist = haversine(userLat, userLng, targetLat, targetLng);
      const brg = bearing(userLat, userLng, targetLat, targetLng);
      document.getElementById("distance").textContent = formatDist(dist);
      document.getElementById("bearing").textContent = formatBearing(brg);
    }

    // ---------- Trail / Scan ----------
    function addTrailPoint(lat, lng, absDelta) {
      const color = strengthColor(absDelta);
      const radius = Math.min(14, 4 + absDelta * 0.4);

      const circle = L.circleMarker([lat, lng], {
        radius: radius,
        color: color,
        weight: 1,
        fillColor: color,
        fillOpacity: 0.55
      }).addTo(trailLayer);

      trailPoints.push(circle);
      if (trailPoints.length > MAX_TRAIL_POINTS) {
        const old = trailPoints.shift();
        trailLayer.removeLayer(old);
      }
    }

    function clearTrail() {
      trailLayer.clearLayers();
      trailPoints = [];
    }

    // ---------- Geolocation ----------
    function startLocation() {
      if (!navigator.geolocation) {
        document.getElementById("gps-status").textContent = "No GPS";
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          updateUserMarker(userLat, userLng, acc);
          updateStats();

          const status = document.getElementById("gps-status");
          status.textContent = "Live · ±" + Math.round(acc) + "m";
          status.classList.add("live");

          // Scan mode logging
          if (scanMode && lastMag != null && baselineMag != null) {
            const now = Date.now();
            if (now - lastScanTime > SCAN_INTERVAL_MS) {
              lastScanTime = now;
              const absDelta = Math.abs(lastMag - baselineMag);
              addTrailPoint(userLat, userLng, absDelta);
            }
          }
        },
        (err) => {
          document.getElementById("gps-status").textContent = "GPS denied";
          console.warn(err);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 10000
        }
      );
    }

    // ---------- Magnetometer / Orientation ----------
    function initSensors() {
      if ("Magnetometer" in window) {
        try {
          const mag = new Magnetometer({ frequency: 10 });
          mag.addEventListener("reading", () => {
            const strength = Math.sqrt(mag.x**2 + mag.y**2 + mag.z**2);
            handleMagReading(strength);
          });
          mag.addEventListener("error", (e) => {
            console.warn("Magnetometer error", e.error);
            fallbackOrientation();
          });
          mag.start();
          magSupported = true;
          document.getElementById("mag-status").textContent = "Mag: live";
          return;
        } catch (e) {
          console.warn("Magnetometer failed", e);
        }
      }
      fallbackOrientation();
    }

    function fallbackOrientation() {
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          document.getElementById("mag-status").textContent = "Mag: tap to enable";
          document.body.addEventListener("click", requestOrientationPermission, { once: true });
        } else {
          window.addEventListener("deviceorientation", handleOrientation);
          document.getElementById("mag-status").textContent = "Mag: orientation";
        }
      } else {
        document.getElementById("mag-status").textContent = "Mag: unavailable";
      }
    }

    function requestOrientationPermission() {
      DeviceOrientationEvent.requestPermission()
        .then((state) => {
          if (state === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
            document.getElementById("mag-status").textContent = "Mag: orientation";
          } else {
            document.getElementById("mag-status").textContent = "Mag: denied";
          }
        })
        .catch(console.error);
    }

    function handleOrientation(e) {
      // Compass heading (prefer webkitCompassHeading on iOS)
      let heading = null;
      if (typeof e.webkitCompassHeading === "number") {
        heading = e.webkitCompassHeading; // 0 = North, clockwise
      } else if (e.absolute && e.alpha != null) {
        heading = (360 - e.alpha) % 360; // convert to compass bearing
      }

      if (heading != null) {
        const rose = document.getElementById("compass-rose");
        const label = document.getElementById("compass-label");
        // Rotate so needle (which points up) points to magnetic north relative to device
        rose.style.transform = `rotate(${-heading}deg)`;
        label.textContent = Math.round(heading) + "°";
      }

      // Also feed a rough mag proxy when absolute orientation is available
      if (e.absolute && e.alpha != null) {
        const proxy = Math.abs(e.alpha) + Math.abs(e.beta || 0) + Math.abs(e.gamma || 0);
        handleMagReading(proxy);
      }
    }

    function handleMagReading(value) {
      lastMag = value;
      magHistory.push(value);
      if (magHistory.length > MAG_HISTORY_LEN) magHistory.shift();

      if (baselineMag == null && magHistory.length >= 6) {
        baselineMag = magHistory.reduce((a, b) => a + b, 0) / magHistory.length;
      }

      const fieldEl = document.getElementById("field");
      const deltaEl = document.getElementById("delta");
      const fillEl = document.getElementById("strength-fill");
      const strengthText = document.getElementById("strength-text");

      if (baselineMag != null) {
        const delta = value - baselineMag;
        const absDelta = Math.abs(delta);
        fieldEl.textContent = value.toFixed(1) + " µT";
        deltaEl.textContent = (delta >= 0 ? "+" : "") + delta.toFixed(1);

        // Strength bar (0–40 µT mapped to 0–100%)
        const pct = Math.min(100, (absDelta / 40) * 100);
        fillEl.style.width = pct + "%";
        strengthText.textContent = absDelta.toFixed(1) + " µT Δ";

        anomaly = absDelta > 12;

        const panel = document.getElementById("panel");
        const magStatus = document.getElementById("mag-status");

        if (anomaly) {
          panel.classList.add("anomaly-active");
          magStatus.textContent = "Mag: anomaly";
          magStatus.classList.add("anomaly");
        } else {
          panel.classList.remove("anomaly-active");
          magStatus.textContent = "Mag: live";
          magStatus.classList.remove("anomaly");
        }
      } else {
        fieldEl.textContent = value.toFixed(1);
        deltaEl.textContent = "calibrating";
        fillEl.style.width = "0%";
        strengthText.textContent = "calibrating";
      }
    }

    // ---------- Generate Attractor ----------
    function generateAttractor() {
      if (userLat == null) {
        alert("Still waiting for your location…");
        return;
      }

      const intention = document.getElementById("intention").value.trim() || "explore";
      const radius = parseInt(document.getElementById("radius").value, 10);
      const seed = intention + "|" + Date.now().toString().slice(-6);
      const rng = seededRandom(seed);

      const point = randomPointInRadius(userLat, userLng, radius, rng);
      setTarget(point.lat, point.lng);
      map.panTo([userLat, userLng]);
    }

    // ---------- UI wiring ----------
    document.getElementById("generate").addEventListener("click", generateAttractor);

    document.getElementById("radius").addEventListener("input", (e) => {
      const m = parseInt(e.target.value, 10);
      document.getElementById("radius-val").textContent =
        m >= 1000 ? (m / 1000).toFixed(1) + " km" : m + " m";
    });

    document.getElementById("scanBtn").addEventListener("click", () => {
      scanMode = !scanMode;
      const btn = document.getElementById("scanBtn");
      if (scanMode) {
        btn.textContent = "Scan Mode: On";
        btn.classList.add("scan-on");
        btn.classList.remove("secondary");
      } else {
        btn.textContent = "Scan Mode: Off";
        btn.classList.remove("scan-on");
        btn.classList.add("secondary");
      }
    });

    document.getElementById("clearTrail").addEventListener("click", clearTrail);

    // ---------- Boot ----------
    initMap();
    startLocation();
    initSensors();

    document.body.addEventListener("touchmove", (e) => {
      if (e.target.closest(".panel")) return;
    }, { passive: true });
  </script>
</body>
</html>
