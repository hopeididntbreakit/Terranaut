<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TerraNaut</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: rgba(15, 20, 28, 0.92);
      --border: rgba(120, 160, 200, 0.15);
      --text: #e8f0f8;
      --muted: #8a9bb0;
      --accent: #5b9fd4;
      --accent-dim: #3a6a8a;
      --anomaly: #e07a5f;
      --good: #6bcB77;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Subtle custom map styling */
    .leaflet-container {
      background: #0d1218;
    }

    .panel {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: var(--muted);
    }

    input[type="text"]:focus {
      border-color: var(--accent-dim);
    }

    button {
      background: var(--accent);
      color: #0b0f14;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:active {
      background: #4a8bc0;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stat-value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .anomaly-active .stat-value.mag {
      color: var(--anomaly);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      font-size: 11px;
    }

    .pill.live {
      color: var(--good);
    }

    .pill.anomaly {
      color: var(--anomaly);
      background: rgba(224, 122, 95, 0.15);
    }

    .radius-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    /* Target marker pulse */
    .target-pulse {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 0 rgba(91, 159, 212, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(91, 159, 212, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(91, 159, 212, 0); }
      100% { box-shadow: 0 0 0 0 rgba(91, 159, 212, 0); }
    }

    .user-dot {
      width: 14px;
      height: 14px;
      background: #fff;
      border: 3px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .hidden {
      display: none !important;
    }

    .info-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <div class="status-bar">
      <span id="gps-status" class="pill">Locating…</span>
      <span id="mag-status" class="pill">Mag: —</span>
    </div>

    <div class="row">
      <input type="text" id="intention" placeholder="Intention (optional)" maxlength="80" />
      <button id="generate">Go</button>
    </div>

    <div class="row radius-control">
      <span>Radius</span>
      <input type="range" id="radius" min="300" max="4000" step="100" value="1200" />
      <span id="radius-val">1.2 km</span>
    </div>

    <div class="stats" id="stats">
      <div>Distance <span class="stat-value" id="distance">—</span></div>
      <div>Bearing <span class="stat-value" id="bearing">—</span></div>
      <div>Field <span class="stat-value mag" id="field">—</span></div>
      <div>Δ Field <span class="stat-value mag" id="delta">—</span></div>
    </div>

    <div class="info-note" id="note">
      Walk toward the point. Magnetic field changes can hint at nearby metal or infrastructure.
    </div>
  </div>

  <script>
    // ---------- Config ----------
    const DEFAULT_RADIUS = 1200; // meters

    // ---------- State ----------
    let map, userMarker, targetMarker, accuracyCircle;
    let userLat = null, userLng = null;
    let targetLat = null, targetLng = null;
    let watchId = null;

    // Magnetic
    let magSupported = false;
    let baselineMag = null;
    let lastMag = null;
    let magHistory = [];
    const MAG_HISTORY_LEN = 12;
    let anomaly = false;

    // ---------- Helpers ----------
    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function bearing(lat1, lng1, lat2, lng2) {
      const y = Math.sin(toRad(lng2-lng1)) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function formatDist(m) {
      if (m == null) return "—";
      if (m < 1000) return Math.round(m) + " m";
      return (m / 1000).toFixed(2) + " km";
    }

    function formatBearing(b) {
      if (b == null) return "—";
      const dirs = ["N","NE","E","SE","S","SW","W","NW"];
      const idx = Math.round(b / 45) % 8;
      return Math.round(b) + "° " + dirs[idx];
    }

    // Simple seeded random from string
    function seededRandom(seedStr) {
      let h = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function() {
        h += h << 13; h ^= h >>> 7; h += h << 3;
        h ^= h >>> 17; h += h << 5;
        return (h >>> 0) / 4294967296;
      };
    }

    function randomPointInRadius(lat, lng, radiusM, rng) {
      // Uniform in circle
      const r = radiusM * Math.sqrt(rng());
      const theta = rng() * 2 * Math.PI;
      const dx = r * Math.cos(theta);
      const dy = r * Math.sin(theta);
      const newLat = lat + (dy / 111320);
      const newLng = lng + (dx / (111320 * Math.cos(toRad(lat))));
      return { lat: newLat, lng: newLng };
    }

    // ---------- Map ----------
    function initMap() {
      map = L.map("map", {
        zoomControl: false,
        attributionControl: false
      }).setView([36.16, -86.78], 14); // Nashville fallback

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        subdomains: "abcd"
      }).addTo(map);

      L.control.zoom({ position: "topright" }).addTo(map);
    }

    function updateUserMarker(lat, lng, accuracy) {
      const latlng = [lat, lng];
      if (!userMarker) {
        userMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: "",
            html: '<div class="user-dot"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
          })
        }).addTo(map);
      } else {
        userMarker.setLatLng(latlng);
      }

      if (accuracyCircle) {
        accuracyCircle.setLatLng(latlng).setRadius(accuracy || 30);
      } else {
        accuracyCircle = L.circle(latlng, {
          radius: accuracy || 30,
          color: "#5b9fd4",
          weight: 1,
          fillColor: "#5b9fd4",
          fillOpacity: 0.08
        }).addTo(map);
      }
    }

    function setTarget(lat, lng) {
      targetLat = lat;
      targetLng = lng;
      const latlng = [lat, lng];

      if (targetMarker) {
        targetMarker.setLatLng(latlng);
      } else {
        targetMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: "",
            html: '<div class="target-pulse"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          })
        }).addTo(map);
      }

      // Fit both points with padding
      if (userLat != null) {
        const bounds = L.latLngBounds([userLat, userLng], latlng);
        map.fitBounds(bounds.pad(0.35));
      } else {
        map.setView(latlng, 15);
      }
      updateStats();
    }

    function updateStats() {
      if (userLat == null || targetLat == null) {
        document.getElementById("distance").textContent = "—";
        document.getElementById("bearing").textContent = "—";
        return;
      }
      const dist = haversine(userLat, userLng, targetLat, targetLng);
      const brg = bearing(userLat, userLng, targetLat, targetLng);
      document.getElementById("distance").textContent = formatDist(dist);
      document.getElementById("bearing").textContent = formatBearing(brg);
    }

    // ---------- Geolocation ----------
    function startLocation() {
      if (!navigator.geolocation) {
        document.getElementById("gps-status").textContent = "No GPS";
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          updateUserMarker(userLat, userLng, acc);
          updateStats();

          const status = document.getElementById("gps-status");
          status.textContent = "Live · ±" + Math.round(acc) + "m";
          status.classList.add("live");
        },
        (err) => {
          document.getElementById("gps-status").textContent = "GPS denied";
          console.warn(err);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 10000
        }
      );
    }

    // ---------- Magnetometer / Orientation ----------
    function initSensors() {
      // Try modern Magnetometer API first
      if ("Magnetometer" in window) {
        try {
          const mag = new Magnetometer({ frequency: 10 });
          mag.addEventListener("reading", () => {
            const strength = Math.sqrt(mag.x**2 + mag.y**2 + mag.z**2);
            handleMagReading(strength);
          });
          mag.addEventListener("error", (e) => {
            console.warn("Magnetometer error", e.error);
            fallbackOrientation();
          });
          mag.start();
          magSupported = true;
          document.getElementById("mag-status").textContent = "Mag: live";
          return;
        } catch (e) {
          console.warn("Magnetometer failed", e);
        }
      }

      // Fallback: DeviceOrientation (limited magnetic info)
      fallbackOrientation();
    }

    function fallbackOrientation() {
      if (window.DeviceOrientationEvent) {
        // iOS 13+ requires permission
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          // We'll request on first user gesture
          document.getElementById("mag-status").textContent = "Mag: tap to enable";
          document.body.addEventListener("click", requestOrientationPermission, { once: true });
        } else {
          window.addEventListener("deviceorientation", handleOrientation);
          document.getElementById("mag-status").textContent = "Mag: orientation";
        }
      } else {
        document.getElementById("mag-status").textContent = "Mag: unavailable";
      }
    }

    function requestOrientationPermission() {
      DeviceOrientationEvent.requestPermission()
        .then((state) => {
          if (state === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
            document.getElementById("mag-status").textContent = "Mag: orientation";
          } else {
            document.getElementById("mag-status").textContent = "Mag: denied";
          }
        })
        .catch(console.error);
    }

    function handleOrientation(e) {
      // absolute is better when available
      if (e.absolute && e.alpha != null) {
        // Rough proxy: use alpha + beta + gamma variation
        const proxy = Math.abs(e.alpha) + Math.abs(e.beta || 0) + Math.abs(e.gamma || 0);
        handleMagReading(proxy);
      }
    }

    function handleMagReading(value) {
      lastMag = value;
      magHistory.push(value);
      if (magHistory.length > MAG_HISTORY_LEN) magHistory.shift();

      if (baselineMag == null && magHistory.length >= 6) {
        baselineMag = magHistory.reduce((a, b) => a + b, 0) / magHistory.length;
      }

      const fieldEl = document.getElementById("field");
      const deltaEl = document.getElementById("delta");

      if (baselineMag != null) {
        const delta = value - baselineMag;
        const absDelta = Math.abs(delta);
        fieldEl.textContent = value.toFixed(1) + " µT";
        deltaEl.textContent = (delta >= 0 ? "+" : "") + delta.toFixed(1);

        // Simple anomaly threshold (tune as needed)
        const wasAnomaly = anomaly;
        anomaly = absDelta > 12; // µT threshold — adjust based on real-world feel

        const panel = document.getElementById("panel");
        const magStatus = document.getElementById("mag-status");

        if (anomaly) {
          panel.classList.add("anomaly-active");
          magStatus.textContent = "Mag: anomaly";
          magStatus.classList.add("anomaly");
        } else {
          panel.classList.remove("anomaly-active");
          magStatus.textContent = "Mag: live";
          magStatus.classList.remove("anomaly");
        }
      } else {
        fieldEl.textContent = value.toFixed(1);
        deltaEl.textContent = "calibrating";
      }
    }

    // ---------- Generate Attractor ----------
    function generateAttractor() {
      if (userLat == null) {
        alert("Still waiting for your location…");
        return;
      }

      const intention = document.getElementById("intention").value.trim() || "explore";
      const radius = parseInt(document.getElementById("radius").value, 10);
      const seed = intention + "|" + Date.now().toString().slice(-6);
      const rng = seededRandom(seed);

      const point = randomPointInRadius(userLat, userLng, radius, rng);
      setTarget(point.lat, point.lng);

      // Soft recenter
      map.panTo([userLat, userLng]);
    }

    // ---------- UI wiring ----------
    document.getElementById("generate").addEventListener("click", generateAttractor);

    document.getElementById("radius").addEventListener("input", (e) => {
      const m = parseInt(e.target.value, 10);
      document.getElementById("radius-val").textContent =
        m >= 1000 ? (m / 1000).toFixed(1) + " km" : m + " m";
    });

    // ---------- Boot ----------
    initMap();
    startLocation();
    initSensors();

    // Prevent pull-to-refresh / overscroll on mobile
    document.body.addEventListener("touchmove", (e) => {
      if (e.target.closest(".panel")) return;
      // allow map interaction
    }, { passive: true });
  </script>
</body>
</html>
